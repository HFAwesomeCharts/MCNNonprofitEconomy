
<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

.sankey {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 100vh;
    height: 100vw;

    transform:
        translate(-50%, -50%)
        rotate(90deg)
        scale(0.90);

    transform-origin: center center;
}

.sankey iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: none;
    overflow: hidden;
}

</style>

</head>

<body>

<div class="sankey">

    <img
        src="USINE_sankey_poster.svg"
        style="width: 100%; height: 100%; object-fit: contain;">

</div>

</body>

</html>
