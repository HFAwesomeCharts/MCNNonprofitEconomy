<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rotated Figure</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            transform: rotate(90deg) scale(2);
        }
    </style>
</head>
<body>
    <img src="USINE_sankey_poster.svg">
</body>
</html>
