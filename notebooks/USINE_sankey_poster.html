
<html>

<head>

<meta charset="utf-8" />

<style>

html,
body {
    margin: 0;
    padding: 0;
    background: white;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* ----------------------------------------------------------
   OUTER CONTAINER

   This represents the browser window.
   ---------------------------------------------------------- */

.sankey-wrapper {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}


/* ----------------------------------------------------------
   SANKEY

   The SVG itself is 1056 x 1440 px.

   We give it an explicit large box first, then rotate
   the entire box 90 degrees.

   After rotation, it becomes approximately:

       1440 px wide
       1056 px tall
   ---------------------------------------------------------- */

.sankey {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 1056px;
    height: 1440px;

    transform: translate(-50%, -50%) rotate(90deg);
    transform-origin: center center;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* ----------------------------------------------------------
   SVG IMAGE

   Force the SVG to fill the large box.
   ---------------------------------------------------------- */

.sankey img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: fill;
}

</style>

</head>


<body>


<div class="sankey-wrapper">

    <div class="sankey">

        <img
            src="USINE_sankey_poster.svg"
        >

    </div>

</div>


</body>

</html>
