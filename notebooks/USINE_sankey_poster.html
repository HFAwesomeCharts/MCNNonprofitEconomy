<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotated Figure</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        .wrapper {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 100vh;
            height: 100vw;

            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <img src="USINE_sankey_poster.svg">
    </div>

</body>
</html>
