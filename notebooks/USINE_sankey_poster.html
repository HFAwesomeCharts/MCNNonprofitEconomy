
<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}


/* ----------------------------------------------------------
   THE SVG IS GIVEN A LARGE, EXPLICIT BOX.
   THEN THAT ENTIRE BOX IS ROTATED.
   ---------------------------------------------------------- */

.sankey {
    position: absolute;

    width: 1056px;
    height: 1440px;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        rotate(90deg);

    transform-origin: center center;
}


/* ----------------------------------------------------------
   THE SVG IS LOADED AS A SEPARATE DOCUMENT.
   ---------------------------------------------------------- */

.sankey iframe {
    display: block;

    width: 1056px;
    height: 1440px;

    border: none;
}

</style>

</head>


<body>

<div class="sankey">

    <iframe
        src="USINE_sankey_poster.svg">
    </iframe>

</div>

</body>

</html>
